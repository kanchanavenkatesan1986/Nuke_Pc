<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Movies - VIP Movies</title>
    
    <link rel="stylesheet" href="./src/main.css"/>
    <script src="./src/main.js" defer></script>
    
    <!-- Lexend Font & FontAwesome Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body>

<div class="main">

    <!-- Navigation Drawer (Overlay) -->
    <div id="myNav" class="overlay">
        <img src="./m-image/Close icon.png" class="close" onclick="closeNav()" alt="Close Menu">
        <img src="./m-image/VIP Movies.jpg" class="navimg" alt="VIP Movies">
        
        <div class="nav-menu">
            <a href="index.html" class="nav-link">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a href="sub-pages/feedback.html" class="nav-link">
                <i class="fa-solid fa-comment-dots"></i> Feedback
            </a>
            <a href="sub-pages/about.html" class="nav-link">
                <i class="fa-solid fa-circle-info"></i> About
            </a>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <img src="./m-image/Menu icon.png" class="menu" onclick="openNav()" alt="Menu">
        <img src="./m-image/Vip Title.png" class="title" alt="VIP Movies Logo" onclick="location.href='index.html'" style="cursor:pointer;">
        <a href="index.html" style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;">
            <i class="fa-solid fa-house" style="font-size: 20px; color: var(--text-primary); opacity: 0.85;"></i>
        </a>
    </div>

    <!-- SEARCH INPUTS -->
    <input type="text" id="searchInput" placeholder="Search movie by title...">

    <div class="search-box">
        <select id="yearFilter">
            <option value="">All Years</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
        </select>

        <select id="langFilter">
            <option value="">All Languages</option>
            <option value="Tamil">Tamil</option>
            <option value="Hollywood">Hollywood</option>
        </select>
    </div>

    <!-- MOVIE GRID -->
    <div id="movieList" class="movies-grid"></div>

    <!-- Movie Not Available Message -->
    <div id="notAvailable" class="not-box" style="display: none;">
        <i class="fa-solid fa-film"></i>
        <h1 class="note">Movie Not Available...</h1>
    </div>

   <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="search.html" class="bottom-nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </a>
        <a href="trending.html" class="bottom-nav-item">
            <i class="fa-solid fa-fire"></i>
            <span>Trending</span>
        </a>
        <a href="years.html" class="bottom-nav-item">
            <i class="fa-solid fa-calendar-days"></i>
            <span>Years</span>
        </a>
        <a href="new-releases.html" class="bottom-nav-item">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>New</span>
        </a>
    </div>

</div>

<script>
    let allMovies = [];

    fetch("https://database.akatsuki-pvt-ltd.workers.dev/movies")
        .then(res => res.json())
        .then(data => {
            allMovies = data;
            displayMovies(allMovies);
        })
        .catch(err => {
            console.error("Error loading movies:", err);
            document.getElementById("notAvailable").style.display = "flex";
        });

    function displayMovies(movies) {
        const container = document.getElementById("movieList");
        const notAvailable = document.getElementById("notAvailable");
        
        container.innerHTML = "";
        
        if (movies.length === 0) {
            notAvailable.style.display = "flex";
            return;
        }
        
        notAvailable.style.display = "none";

        movies.forEach(movie => {
            const card = document.createElement("a");
            card.href = "watch.html?reward=" + movie.id;
            card.className = "list-card-link";

            card.innerHTML = `
                <div class="list-card">
                    <div class="list-card-img-wrapper">
                        <img class="list-card-img" src="${movie.image}" alt="${movie.title}" loading="lazy">
                        <span class="list-card-badge">${movie.year}</span>
                    </div>
                    <div class="list-card-details">
                        <h3 class="list-card-title">${movie.title}</h3>
                        <p class="list-card-info">Language: ${movie.language}</p>
                        <p class="list-card-info">Release: ${movie.release}</p>
                        <div class="list-card-action">
                            <i class="fa-solid fa-circle-play"></i> Watch Ads - Unlock
                        </div>
                    </div>
                </div>
            `;

            container.appendChild(card);
        });
    }

    document.getElementById("searchInput").addEventListener("input", filterMovies);
    document.getElementById("yearFilter").addEventListener("change", filterMovies);
    document.getElementById("langFilter").addEventListener("change", filterMovies);

    function filterMovies() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const year = document.getElementById("yearFilter").value;
        const lang = document.getElementById("langFilter").value.toLowerCase();

        const filtered = allMovies.filter(movie => {
            const matchesSearch = movie.title.toLowerCase().includes(search);
            const matchesYear = (year === "" || movie.year == year);
            
            // Standardize category and language check
            const categoryMatch = movie.category.toLowerCase().includes(lang);
            const langMatch = movie.language.toLowerCase().includes(lang);
            const matchesLang = (lang === "" || categoryMatch || langMatch);

            return matchesSearch && matchesYear && matchesLang;
        });

        displayMovies(filtered);
    }
</script>

</body>
</html>
