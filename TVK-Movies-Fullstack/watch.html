<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Movie - VIP Movies</title>
    
    <link rel="stylesheet" href="./src/main.css"/>
    <script src="./src/main.js" defer></script>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        /* Watch Page Specific CSS Layout */
        .watch-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 32px;
            margin-top: 10px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .watch-container {
                grid-template-columns: 1fr;
                gap: 24px;
                text-align: center;
            }
        }

        .poster-sec {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .watch-poster {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: var(--border-radius);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: var(--transition);
        }

        .watch-poster:hover {
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .details-sec {
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
        }

        .movie-title {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (max-width: 480px) {
            .meta-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }

        .meta-item {
            font-size: 14px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
        }

        @media (max-width: 768px) {
            .meta-item {
                text-align: center;
            }
        }

        .meta-label {
            color: var(--accent);
            font-weight: 600;
            margin-right: 4px;
        }

        /* Top Actions Section */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 8px;
            width: 100%;
        }

        @media (max-width: 480px) {
            .action-buttons {
                grid-template-columns: 1fr;
            }
        }

        .btn-watch, .btn-download {
            padding: 14px 24px;
            border-radius: var(--border-radius);
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            text-decoration: none;
        }

        .btn-watch {
            background: linear-gradient(135deg, var(--accent) 0%, #d4a70f 100%);
            color: #000 !important;
        }

        .btn-watch:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 197, 24, 0.3);
        }

        .btn-download {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-download:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* WhatsApp Share Button */
        .btn-whatsapp-share {
            background-color: var(--success);
            color: white !important;
            border: none;
            border-radius: 9999px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            align-self: flex-start;
            margin-top: 4px;
            text-decoration: none;
        }

        .btn-whatsapp-share:hover {
            background-color: var(--success-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        @media (max-width: 768px) {
            .btn-whatsapp-share {
                align-self: center;
                margin-top: 10px;
            }
        }

        /* Story Section */
        .story-container {
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 24px;
            margin-top: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
        }

        .story-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent);
            position: relative;
            padding-left: 12px;
        }

        .story-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 3px;
            background-color: var(--accent);
        }

        .story-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Quality Table List */
        .quality-box {
            margin-top: 28px;
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .quality-header {
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .quality-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quality-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background-color: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .quality-row:hover {
            border-color: var(--accent);
            transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .quality-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quality-info i {
            font-size: 18px;
            color: var(--accent);
        }

        .quality-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .quality-actions {
            display: flex;
            gap: 12px;
        }

        .quality-btn-play, .quality-btn-down {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border: none;
        }

        .quality-btn-play {
            background-color: rgba(245, 197, 24, 0.15);
            color: var(--accent);
        }

        .quality-btn-play:hover {
            background-color: var(--accent);
            color: #000 !important;
        }

        .quality-btn-down {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }

        .quality-btn-down:hover {
            background-color: var(--text-primary);
            color: #000 !important;
        }
    </style>
</head>

<body>

<div class="main">

    <!-- Navigation Drawer (Overlay) -->
    <div id="myNav" class="overlay">
        <img src="./m-image/Close icon.png" class="close" onclick="closeNav()" alt="Close Menu">
        <img src="./m-image/VIP Movies.jpg" class="navimg" alt="VIP Movies">
        
        <div class="nav-menu">
            <a href="index.html" class="nav-link">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a href="sub-pages/feedback.html" class="nav-link">
                <i class="fa-solid fa-comment-dots"></i> Feedback
            </a>
            <a href="sub-pages/about.html" class="nav-link">
                <i class="fa-solid fa-circle-info"></i> About
            </a>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <img src="./m-image/Menu icon.png" class="menu" onclick="openNav()" alt="Menu">
        <img src="./m-image/Vip Title.png" class="title" alt="VIP Movies Logo" onclick="location.href='index.html'" style="cursor:pointer;">
        <a href="search.html">
            <img src="./m-image/Search icon.png" class="search" alt="Search">
        </a>
    </div>

    <!-- Movie Details Grid Wrapper -->
    <div class="watch-container">
        <!-- Poster Column -->
        <div class="poster-sec">
            <img id="image" class="watch-poster" src="" alt="Movie Poster"/>
        </div>

        <!-- Details Column -->
        <div class="details-sec">
            <button class="btn-whatsapp-share" onclick="shareApp()">
                <i class="fa-brands fa-whatsapp" style="font-size:20px;"></i> Share on WhatsApp
            </button>

            <h1 class="movie-title" id="title">Loading Title...</h1>
            
            <div class="meta-grid">
                <div class="meta-item"><span class="meta-label">Language:</span><span id="language">-</span></div>
                <div class="meta-item"><span class="meta-label">Release:</span><span id="release">-</span></div>
                <div class="meta-item"><span class="meta-label">Duration:</span><span id="duration">-</span></div>
                <div class="meta-item"><span class="meta-label">Director:</span><span id="director">-</span></div>
            </div>
            
            <div class="meta-item" style="width: 100%;"><span class="meta-label">Starring:</span><span id="starring">-</span></div>
            
            <!-- Quick Actions Buttons -->
            <div class="action-buttons">
                <a class="btn-watch p460"><i class="fa-solid fa-circle-play"></i> Watch Now</a>
                <a class="btn-download p460" target="_blank"><i class="fa-solid fa-circle-down"></i> Direct Download</a>
            </div>
        </div>
    </div>

    <!-- Description Block -->
    <div class="story-container">
        <h3 class="story-title">Storyline / Overview</h3>
        <p class="story-text" id="story">Loading movie storyline...</p>
    </div>

    <!-- Quality Select List -->
    <div class="quality-box">
        <h3 class="quality-header">Watch & Download (Select Quality)</h3>
        
        <div class="quality-list">
            <!-- 460p -->
            <div class="quality-row">
                <div class="quality-info">
                    <i class="fa-solid fa-film"></i>
                    <span class="quality-label">Movie Quality - 460p (SD)</span>
                </div>
                <div class="quality-actions">
                    <a class="quality-btn-play p460"><i class="fa-solid fa-play"></i></a>
                    <a class="quality-btn-down p460" target="_blank"><i class="fa-solid fa-download"></i></a>
                </div>
            </div>

            <!-- 720p -->
            <div class="quality-row">
                <div class="quality-info">
                    <i class="fa-solid fa-video"></i>
                    <span class="quality-label">Movie Quality - 720p (HD)</span>
                </div>
                <div class="quality-actions">
                    <a class="quality-btn-play p720"><i class="fa-solid fa-play"></i></a>
                    <a class="quality-btn-down p720" target="_blank"><i class="fa-solid fa-download"></i></a>
                </div>
            </div>

            <!-- 1080p -->
            <div class="quality-row">
                <div class="quality-info">
                    <i class="fa-solid fa-tv"></i>
                    <span class="quality-label">Movie Quality - 1080p (Full HD)</span>
                </div>
                <div class="quality-actions">
                    <a class="quality-btn-play p1080"><i class="fa-solid fa-play"></i></a>
                    <a class="quality-btn-down p1080" target="_blank"><i class="fa-solid fa-download"></i></a>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const movieId = params.get("reward") || params.get("id");

    if(!movieId) {
        document.querySelector(".watch-container").innerHTML = "<div class='not-box'><i class='fa-solid fa-circle-exclamation'></i><p class='note'>No movie selected. Go back to <a href='index.html' style='color:var(--accent);'>Home</a>.</p></div>";
    } else {
        fetch("https://database.akatsuki-pvt-ltd.workers.dev/movies")
            .then(res => res.json())
            .then(data => {
                const movie = data.find(m => m.id == Number(movieId));

                if(!movie){
                    document.querySelector(".watch-container").innerHTML = "<div class='not-box'><i class='fa-solid fa-circle-exclamation'></i><p class='note'>Movie not found. Go back to <a href='index.html' style='color:var(--accent);'>Home</a>.</p></div>";
                    return;
                }

                document.getElementById("title").innerText = movie.title;
                document.getElementById("image").src = movie.image;
                document.getElementById("image").alt = movie.title;
                document.getElementById("language").innerText = " " + movie.language;
                document.getElementById("release").innerText = " " + movie.release;
                document.getElementById("duration").innerText = " " + movie.duration;
                document.getElementById("director").innerText = " " + movie.director;
                document.getElementById("starring").innerText = " " + movie.starring;
                document.getElementById("story").innerText = movie.story;

                // Bind URL links to elements matching class names
                document.querySelectorAll(".p460").forEach(a => {
                    a.href = movie["p460"] || "#";
                });

                document.querySelectorAll(".p720").forEach(a => {
                    a.href = movie["p720"] || "#";
                });

                document.querySelectorAll(".p1080").forEach(a => {
                    a.href = movie["p1080"] || "#";
                });
            })
            .catch(err => {
                console.error("Error fetching movie data:", err);
                document.querySelector(".watch-container").innerHTML = "<div class='not-box'><i class='fa-solid fa-triangle-exclamation'></i><p class='note'>Failed to load movie details. Please try again later.</p></div>";
            });
    }
</script>

</body>
</html>
