<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie List - VIP Movies</title>
    
    <link rel="stylesheet" href="./src/main.css"/>
    <script src="./src/main.js" defer></script>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        .list-header {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 20px 0 16px 0;
            position: relative;
            padding-left: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .list-header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 4px;
            background-color: var(--accent);
            border-radius: 2px;
        }

        .list-back-btn {
            font-size: 14px;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: var(--transition);
        }

        .list-back-btn:hover {
            color: var(--accent-hover);
            transform: translateX(-3px);
        }
    </style>
</head>

<body>

<div class="main">

    <!-- Navigation Drawer (Overlay) -->
    <div id="myNav" class="overlay">
        <img src="./m-image/Close icon.png" class="close" onclick="closeNav()" alt="Close Menu">
        <img src="./m-image/VIP Movies.jpg" class="navimg" alt="VIP Movies">
        
        <div class="nav-menu">
            <a href="index.html" class="nav-link">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a href="sub-pages/feedback.html" class="nav-link">
                <i class="fa-solid fa-comment-dots"></i> Feedback
            </a>
            <a href="sub-pages/about.html" class="nav-link">
                <i class="fa-solid fa-circle-info"></i> About
            </a>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <img src="./m-image/Menu icon.png" class="menu" onclick="openNav()" alt="Menu">
        <img src="./m-image/Vip Title.png" class="title" alt="VIP Movies Logo" onclick="location.href='index.html'" style="cursor:pointer;">
        <a href="search.html">
            <img src="./m-image/Search icon.png" class="search" alt="Search">
        </a>
    </div>

    <!-- Dynamic Category Title -->
    <div class="list-header">
        <span id="listTitle">Movies Collection</span>
        <a href="index.html" class="list-back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- Movie Listing Grid -->
    <div id="movieList" class="movies-grid"></div>

    <!-- Empty Listing Alert -->
    <div id="comingSoon" class="not-box" style="display: none;">
        <i class="fa-solid fa-hourglass-half" style="font-size: 38px; color: var(--accent); margin-bottom: 16px;"></i>
        <h1 class="note" style="line-height: 1.6;">Please Wait...<br>Coming Soon New Movies!</h1>
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const category = params.get("category");
    const year = params.get("year");

    // Display appropriate title based on filters
    const listTitle = document.getElementById("listTitle");
    if(category && year) {
        listTitle.innerText = `${year} ${category} Movies`;
    } else if(category) {
        listTitle.innerText = `${category} Movies`;
    } else if(year) {
        listTitle.innerText = `${year} Movies`;
    }

    fetch("https://database.akatsuki-pvt-ltd.workers.dev/movies")
        .then(res => res.json())
        .then(data => {
            const filtered = data.filter(movie => 
                (!category || movie.category.toLowerCase() === category.toLowerCase()) &&
                (!year || movie.year == year)
            );

            const container = document.getElementById("movieList");
            const comingSoon = document.getElementById("comingSoon");
            
            container.innerHTML = "";

            if(filtered.length === 0) {
                comingSoon.style.display = "flex";
                return;
            }

            comingSoon.style.display = "none";

            filtered.forEach(movie => {
                const card = document.createElement("a");
                card.href = "watch.html?reward=" + movie.id;
                card.className = "list-card-link";

                card.innerHTML = `
                    <div class="list-card">
                        <div class="list-card-img-wrapper">
                            <img class="list-card-img" src="${movie.image}" alt="${movie.title}" loading="lazy">
                            <span class="list-card-badge">${movie.year}</span>
                        </div>
                        <div class="list-card-details">
                            <h3 class="list-card-title">${movie.title}</h3>
                            <p class="list-card-info">Language: ${movie.language}</p>
                            <p class="list-card-info">Release: ${movie.release}</p>
                            <div class="list-card-action">
                                <i class="fa-solid fa-circle-play"></i> Watch Ads - Unlock
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        })
        .catch(err => {
            console.error("Error loading movie listing:", err);
            document.getElementById("comingSoon").style.display = "flex";
        });
</script>

<!-- End Cloudflare Web Analytics -->

</body>
</html>
