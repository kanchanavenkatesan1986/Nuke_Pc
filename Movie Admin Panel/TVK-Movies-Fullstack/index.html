<!-- scripts -->
<script>
    console.log("index.html inline script starts, window.api is:", window.api);
    // Popup Overlay Timer
    const popup = document.getElementById("sharePopup");
    const closeBtn = document.getElementById("closePopup");
    const timerText = document.getElementById("timer");
    let seconds = 10;

    const countdown = setInterval(() => {
        seconds--;
        timerText.innerText = seconds;
        if(seconds <= 0){
            clearInterval(countdown);
            popup.style.display = "none";
        }
    }, 1000);

    closeBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // prevent triggering parent share click
        clearInterval(countdown);
        popup.style.display = "none";
    });

    document.getElementById("shareBtn").addEventListener("click", () => {
        const shareText = `🎬 TVK Movies – தமிழ் Cinemas\n\nதமிழ் & Hollywood Movies - யை இலவசமாக காணுங்கள் “TVK - Movies” - ல்.\n\n🔥 Watch the Latest தமிழ் & Hollywood Movies\n🎥 HD Quality Streaming\n🆕 Regular Movie Updates\n📱 Fast & Easy to Use\n💯 Free Entertainment\n\n✨ Features:\n✅ தமிழ் Movies\n✅ Hollywood Movies in தமிழ்\n✅ Latest Releases\n✅ Simple Interface\n✅ Mobile Friendly\n\n👇 Download Now\n\nhttps://play.google.com/store/apps/details?id=com.vipmovies.tvkmovies&pcampaignid=web_share\n\n📢 Share with Friends & Family and Enjoy Unlimited Entertainment!`;

        if(navigator.share){
            navigator.share({
                title: "TVK Movies",
                text: shareText
            });
        } else {
            window.open("https://wa.me/?text=" + encodeURIComponent(shareText), "_blank");
        }
    });

    // Slider fetch & initialization
    let index = 0;
    api.getSlider()
        .then(data => {
            const slidesContainer = document.getElementById("slidesContainer");
            const dotContainer = document.getElementById("dot");

            data.forEach((item, i) => {
                slidesContainer.innerHTML += `
                    <a href="${item.url}">
                        <div class="slides">
                            <img class="imggg" src="${item.image}" alt="Slide">
                        </div>
                    </a>
                `;
                dotContainer.innerHTML += `<span class="dot" onclick="setSlide(${i})"></span>`;
            });
            startSlider();
        })
        .catch(err => console.error("Error loading slider:", err));

    let changeSlideTimeout;
    function startSlider(){
        const slides = document.querySelectorAll(".slides");
        const dots = document.querySelectorAll(".dot");
        if (slides.length === 0) return;

        function changeSlide(){
            if(index >= slides.length){
                index = 0;
            }
            showSlide(index);
            index++;
            changeSlideTimeout = setTimeout(changeSlide, 3500);
        }
        changeSlide();
    }

    function showSlide(n) {
        const slides = document.querySelectorAll(".slides");
        const dots = document.querySelectorAll(".dot");
        if(slides.length === 0) return;
        
        slides.forEach((slide, i) => {
            slide.style.display = "none";
            dots[i].classList.remove("active");
        });
        slides[n].style.display = "block";
        dots[n].classList.add("active");
    }

    function setSlide(n) {
        clearTimeout(changeSlideTimeout);
        index = n;
        showSlide(n);
        index++;
        changeSlideTimeout = setTimeout(() => {
            const slides = document.querySelectorAll(".slides");
            if(index >= slides.length) index = 0;
            showSlide(index);
            index++;
        }, 3500);
    }

    function filterMovie(category, year){
        location.href = "list.html?category=" + category + "&year=" + year;
    }

    let allMovies = [];
    api.getMovies()
        .then(data => {
            allMovies = data;
            loadSection("Tamil", "2026", "tamilMovies");
            loadSection("Hollywood", "2025", "hollywoodMovies");
        })
        .catch(err => console.error("Error loading movies:", err));

    function loadSection(category, year, containerId){
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        const movies = allMovies
            .filter(m => m.category === category && m.year === year)
            .slice(0, 10);

        movies.forEach(movie => {
            const card = document.createElement("a");
            card.href = "watch.html?reward=" + movie.id;
            card.className = "movie-card-link";

            const box = document.createElement("div");
            box.className = "movie-card";

            const imgWrapper = document.createElement("div");
            imgWrapper.className = "movie-card-img-wrapper";

            const img = document.createElement("img");
            img.className = "movie-card-img";
            img.src = movie.image;
            img.alt = movie.title;
            img.loading = "lazy";

            imgWrapper.appendChild(img);

            const title = document.createElement("h1");
            title.className = "movie-card-title";
            title.innerText = movie.title;

            box.appendChild(imgWrapper);
            box.appendChild(title);
            card.appendChild(box);
            container.appendChild(card);
        });

        // VIEW ALL CARD
        const viewCard = document.createElement("div");
        viewCard.className = "view-all-card";
        viewCard.onclick = () => filterMovie(category, year);

        viewCard.innerHTML = `
            <div class="view-all-icon">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
            <div class="view-all-text">View All</div>
        `;
        container.appendChild(viewCard);
    }
</script>
